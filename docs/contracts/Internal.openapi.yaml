openapi: 3.0.3
info:
  title: Internal Normative Registry and RAG Consultant API
  version: 1.0.0
  description: >
    Contract for managing normative document registry of institute acts,
    providing direct binary file downloads (DOCX/PDF) without exposing raw server paths,
    and offering concise markdown-formatted RAG consultant answers grounded in official regulations.
paths:
  /api/normative/documents:
    get:
      summary: Search and list normative documents in registry
      description: Retrieve catalog items with semantic keyword filtering, pagination, and download metadata.
      operationId: searchNormativeDocuments
      tags:
        - Normative Registry
      parameters:
        - name: query
          in: query
          required: false
          description: Semantic search query or act title filter
          schema:
            type: string
        - name: docType
          in: query
          required: false
          description: Filter by document type (e.g., protocol, order, schedule, curriculum, regulation)
          schema:
            type: string
            enum:
              - PROTOCOL
              - ORDER
              - SCHEDULE
              - CURRICULUM
              - STAFFING_REPORT
              - REGULATION
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Search results containing matched documents and metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSearchResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/normative/document/{id}/download:
    get:
      summary: Download normative document file directly
      description: Stream direct DOCX or PDF file by document ID without exposing raw server file paths.
      operationId: downloadNormativeDocument
      tags:
        - Normative Registry
      parameters:
        - name: id
          in: path
          required: true
          description: Unique document identifier
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          description: Preferred file format (docx or pdf)
          schema:
            type: string
            enum: [docx, pdf]
            default: docx
      responses:
        '200':
          description: Binary file stream of requested normative document
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="order_104_ums.docx"
            Content-Type:
              schema:
                type: string
                example: application/vnd.openxmlformats-officedocument.wordprocessingml.document
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Document or artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal storage or file generation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/consultant/query:
    post:
      summary: Submit query to RAG expert consultant
      description: Perform semantic retrieval over regulatory base (Rospotrebnadzor and internal institute acts) and return concise, factual markdown answer.
      operationId: queryConsultant
      tags:
        - RAG Consultant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultantQueryRequest'
      responses:
        '200':
          description: Concise markdown-formatted expert answer with citation sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultantQueryResponse'
        '400':
          description: Malformed or empty question payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Upstream AI or vector search service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    DocumentItem:
      type: object
      required:
        - id
        - title
        - docNumber
        - issueDate
        - docType
        - annotation
        - downloadUrl
        - fileFormat
        - fileSizeBytes
      properties:
        id:
          type: string
          format: uuid
          example: "d7b1b3b1-7890-48e2-9d8a-8be4e7bc5a21"
        title:
          type: string
          description: Official human-readable document title
          example: "Протокол заседания Ученого медицинского совета № 4"
        docNumber:
          type: string
          description: Registration act number
          example: "ПР-2026/04"
        issueDate:
          type: string
          format: date
          example: "2026-02-15"
        docType:
          type: string
          enum:
            - PROTOCOL
            - ORDER
            - SCHEDULE
            - CURRICULUM
            - STAFFING_REPORT
            - REGULATION
          example: "PROTOCOL"
        annotation:
          type: string
          description: Human-readable summary or snippet highlighting key resolutions/context
          example: "Повестка заседания: утверждение экзаменационных сессий ординатуры 25ОЭ, 26ОЭ. Кворум подтвержден Горелов/Романова."
        downloadUrl:
          type: string
          description: Clean direct download URL endpoint without local disk path exposure
          example: "/api/normative/document/d7b1b3b1-7890-48e2-9d8a-8be4e7bc5a21/download?format=docx"
        fileFormat:
          type: string
          enum: [docx, pdf]
          example: "docx"
        fileSizeBytes:
          type: integer
          format: int64
          example: 45056
        gostCompliance:
          type: string
          description: Formal standard compliance indicator
          example: "ГОСТ Р 7.0.97-2016"

    DocumentSearchResponse:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentItem'
        total:
          type: integer
          example: 1697
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 85

    ConsultantQueryRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          description: User inquiry regarding regulatory guidelines or institute internal orders
          example: "Каковы требования Роспотребнадзора к остепененности ППС кафедр и кворуму УМС?"
        maxTokens:
          type: integer
          default: 1024
          maximum: 4096
        temperature:
          type: number
          format: float
          default: 0.1
          minimum: 0.0
          maximum: 1.0
        includeCitations:
          type: boolean
          default: true

    CitationSource:
      type: object
      required:
        - documentId
        - title
        - downloadUrl
        - matchedExcerpt
      properties:
        documentId:
          type: string
          format: uuid
          example: "d7b1b3b1-7890-48e2-9d8a-8be4e7bc5a21"
        title:
          type: string
          example: "Справка о кадровом обеспечении и учебной нагрузке ППС кафедр"
        downloadUrl:
          type: string
          example: "/api/normative/document/d7b1b3b1-7890-48e2-9d8a-8be4e7bc5a21/download?format=docx"
        matchedExcerpt:
          type: string
          example: "Доля научно-педагогических работников с учеными степенями составляет не менее 70%."

    ConsultantQueryResponse:
      type: object
      required:
        - answerMarkdown
        - sources
        - latencyMs
      properties:
        answerMarkdown:
          type: string
          description: Concise factual answer strictly formatted in Markdown without conversational filler
          example: "### Требования к кадровому обеспечению и кворуму УМС\n\n1. **Остепененность ППС кафедр**: Доля преподавателей с учеными степенями должна составлять **>= 70%** согласно локальному регламенту и нормативам.\n2. **Кворум УМС**: Заседание признается правомочным при наличии обязательного кворума членов совета (председатель Горелов, секретарь Романова).\n3. **Оформление**: Документы оформляются в строгом соответствии с **ГОСТ Р 7.0.97-2016**."
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CitationSource'
        latencyMs:
          type: integer
          example: 340

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "DOCUMENT_NOT_FOUND"
        message:
          type: string
          example: "The requested document does not exist in the catalog."
        details:
          type: string
          example: "No record matching ID d7b1b3b1-7890-48e2-9d8a-8be4e7bc5a21"
