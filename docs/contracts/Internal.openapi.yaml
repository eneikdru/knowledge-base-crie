openapi: 3.1.0
info:
  title: CRIE Institute AI Assistant & Document Generation API
  description: >-
    Internal API contract defining consultation endpoints with DeepSeek-grounded
    normative knowledge, automated generation of official institute orders
    formatted strictly to GOST R 7.0.97-2016 in .docx format, direct normative
    document download endpoints, concise RAG consultant queries, and fast
    faceted search and document metadata retrieval for desktop and mobile clients.
  version: 1.3.0
servers:
  - url: /api
    description: Internal API server
  - url: /
    description: Root API server
paths:
  /chat:
    post:
      tags:
        - Chat
      summary: Semantic search and answer generation over normative documents
      description: >-
        Performs semantic search across the 1,697 normative corpus documents
        (residency regulations, orders, faculty workload, attestation) and returns
        grounded answer text, matched documents with titles and paths, and response latency.
      operationId: chatSemanticShort
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Grounded answer with matched normative documents and response latency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Bad request due to malformed JSON or unparseable payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '422':
          description: Unprocessable Entity when required query text is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal chat generation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/chat:
    post:
      tags:
        - Chat
      summary: Semantic search and answer generation over normative documents (/api/chat)
      description: >-
        Canonical /api/chat endpoint performing semantic search and grounded answer generation
        across 1,697 institute normative documents, returning answer text, matched documents
        with titles and paths, and response latency.
      operationId: chatSemanticEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Grounded answer with matched normative documents and response latency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Bad request due to malformed JSON or unparseable payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '422':
          description: Unprocessable Entity when required query text is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal chat generation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/normative/document/{id}/download:
    get:
      tags:
        - Normative Documents
      summary: Download normative document in DOCX or PDF format
      description: >-
        Safe binary document download endpoint identified strictly by opaque document
        identifier without exposing or accepting raw local filesystem paths.
      operationId: downloadNormativeDocumentApi
      parameters:
        - name: id
          in: path
          required: true
          description: Canonical unique identifier of the normative document
          schema:
            type: string
            example: "DOC-2026-FGOS-310836"
        - name: format
          in: query
          required: false
          description: Requested file format variant (docx or pdf)
          schema:
            type: string
            enum: [docx, pdf]
            default: docx
      responses:
        '200':
          description: Document binary payload stream (DOCX or PDF)
          headers:
            Content-Disposition:
              schema:
                type: string
                example: "attachment; filename=\"DOC-2026-FGOS-310836.docx\""
            Content-Type:
              schema:
                type: string
                example: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid document ID or format parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Document resource not found in repository
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error streaming normative file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /normative/document/{id}/download:
    get:
      tags:
        - Normative Documents
      summary: Download normative document (root route alias)
      description: Root alias for downloading normative documents safely by identifier without raw paths.
      operationId: downloadNormativeDocumentRoot
      parameters:
        - name: id
          in: path
          required: true
          description: Canonical unique identifier of the normative document
          schema:
            type: string
            example: "DOC-2026-FGOS-310836"
        - name: format
          in: query
          required: false
          description: Requested file format variant (docx or pdf)
          schema:
            type: string
            enum: [docx, pdf]
            default: docx
      responses:
        '200':
          description: Document binary payload stream
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/consultant/query:
    post:
      tags:
        - RAG Consultant
      summary: Query the expert RAG consultant on normative and Rospotrebnadzor base
      description: >-
        Submits queries to the expert RAG consultant, returning concise, structured,
        markdown-formatted responses without conversational fluff, backed by citations
        with direct document download links.
      operationId: queryRagConsultantApi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagConsultantQueryRequest'
      responses:
        '200':
          description: Concise markdown response grounded in normative documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagConsultantQueryResponse'
        '400':
          description: Invalid request body or empty query text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '422':
          description: Unprocessable query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: RAG inference and knowledge retrieval engine error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /consultant/query:
    post:
      tags:
        - RAG Consultant
      summary: Query the expert RAG consultant (root route alias)
      description: Root alias for querying the expert RAG consultant.
      operationId: queryRagConsultantRoot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagConsultantQueryRequest'
      responses:
        '200':
          description: Concise markdown response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagConsultantQueryResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /search:
    post:
      tags:
        - Search
      summary: Fast normative search with facet filters and snippet highlights
      description: >-
        Performs full-text and semantic search across normative corpus and generated
        documents with faceted filters and contextual highlight snippets for responsive UI.
      operationId: searchDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search results matching the query terms and facet filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Bad request due to malformed JSON or unparseable payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '422':
          description: Unprocessable Entity with deterministic validation error structures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Search service internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/facets:
    get:
      tags:
        - Documents
        - Search
      summary: Get document facet counts and aggregations
      description: >-
        Returns available document facets with counts for document types, specialties, and years
        to populate search filter panels in one click.
      operationId: getDocumentFacets
      parameters:
        - name: query
          in: query
          required: false
          description: Optional search text to restrict facet count calculations
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter facet counts by document status
          schema:
            type: string
            enum: [ACTIVE, ARCHIVED, DRAFT, SUPERSEDED]
            default: ACTIVE
      responses:
        '200':
          description: Facet distributions calculated across active institute documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFacetsResponse'
        '422':
          description: Validation error for invalid facet query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error calculating facets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/{documentId}:
    get:
      tags:
        - Documents
      summary: Retrieve document metadata and resource details
      description: >-
        Fetches comprehensive metadata, legal grounding, and structural information
        for a specific document in the institute repository.
      operationId: getDocumentMetadata
      parameters:
        - name: documentId
          in: path
          required: true
          description: Unique identifier of the document resource
          schema:
            type: string
            example: "DOC-2026-FGOS-310836"
      responses:
        '200':
          description: Document metadata retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMetadataResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error retrieving document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /assistant/chat:
    post:
      tags:
        - Assistant
      summary: Submit a consultation query to the personal AI assistant
      description: >-
        Provides legally grounded, accurate consultation using institute standards,
        FGOS VO, academic calendar, GIA stages, SanPiN, and VAK requirements.
      operationId: submitConsultationQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationRequest'
      responses:
        '200':
          description: Successful consultation response with verified legal references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationResponse'
        '400':
          description: Invalid request parameters or missing context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '422':
          description: Unprocessable consultation query payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Assistant processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/generate:
    post:
      tags:
        - Order Generation
      summary: Generate an official institute order draft in MS Word (.docx) format
      description: >-
        Generates official orders (enrollment, admission to GIA, scholarship appointment)
        compliant with GOST R 7.0.97-2016 requirements (Times New Roman 14pt, 30/15 mm margins,
        Rospotrebnadzor requisites).
      operationId: generateOrderDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderGenerationRequest'
      responses:
        '200':
          description: Order draft generated successfully (returns binary docx or generation result)
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/OrderGenerationResponse'
        '400':
          description: Validation error due to missing mandatory GOST fields or commission details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '422':
          description: Unprocessable order generation parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Document generation engine error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ChatMessageRole:
      type: string
      enum: [system, user, assistant]
      description: Role of the message sender in the conversation
      example: user

    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          $ref: '#/components/schemas/ChatMessageRole'
        content:
          type: string
          description: Text content of the conversation message
          example: "Какие документы регламентируют промежуточную аттестацию ординаторов?"
        timestamp:
          type: string
          format: date-time
          example: "2026-11-09T08:00:00Z"

    ChatFilters:
      type: object
      description: Optional filtering criteria across normative documents
      properties:
        documentTypes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentTypeEnum'
          example: [REGULATIONS, ORDERS]
        specialtyCodes:
          type: array
          items:
            $ref: '#/components/schemas/SpecialtyCodeEnum'
          example: ["31.08.36"]
        years:
          type: array
          items:
            type: integer
          example: [2025, 2026]
        category:
          type: string
          description: Functional category filter (e.g. ordinatura, attestation, workload, orders)
          example: "ordinatura"

    ChatRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: User question or search query string for grounded generation
          example: "Каков порядок проведения промежуточной аттестации ординаторов по эпидемиологии?"
        filters:
          $ref: '#/components/schemas/ChatFilters'
        history:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          description: Conversation message history for multi-turn dialogue context
        historyContext:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          description: Contextual history alias for client interoperability
        history_context:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          description: Snake_case history context alias for client interoperability

    MatchedDocument:
      type: object
      required:
        - title
        - path
      properties:
        documentId:
          type: string
          description: Document unique identifier
          example: "DOC-2026-ORD-ATTEST-01"
        title:
          type: string
          description: Title of matched normative document
          example: "Положение о порядке проведения промежуточной аттестации ординаторов"
        path:
          type: string
          description: Canonical repository path or URI to the document file
          example: "data/normative/regulations/polozhenie_attestatsiya_2026.pdf"
        downloadUrl:
          type: string
          description: Direct download URL without raw local paths
          example: "/api/normative/document/DOC-2026-ORD-ATTEST-01/download"
        downloadDocxUrl:
          type: string
          description: Direct DOCX download URL
          example: "/api/normative/document/DOC-2026-ORD-ATTEST-01/download?format=docx"
        downloadPdfUrl:
          type: string
          description: Direct PDF download URL
          example: "/api/normative/document/DOC-2026-ORD-ATTEST-01/download?format=pdf"
        score:
          type: number
          format: float
          description: Relevance ranking score
          example: 0.94
        snippet:
          type: string
          description: Matched contextual text passage or excerpt
          example: "Промежуточная аттестация ординаторов проводится два раза в год в форме зачетов и экзаменов..."

    ChatResponse:
      type: object
      required:
        - answer
        - matchedDocuments
        - latencyMs
      properties:
        answer:
          type: string
          description: Generated answer text grounded in the normative corpus
          example: "Промежуточная аттестация ординаторов проводится два раза в год в соответствии с учебным планом кафедры..."
        answerText:
          type: string
          description: Answer text alias
          example: "Промежуточная аттестация ординаторов проводится два раза в год..."
        answer_text:
          type: string
          description: Snake_case answer text alias
        matchedDocuments:
          type: array
          items:
            $ref: '#/components/schemas/MatchedDocument'
          description: List of matched normative documents including titles and paths
        matched_documents:
          type: array
          items:
            $ref: '#/components/schemas/MatchedDocument'
          description: Snake_case alias for matched documents
        latencyMs:
          type: integer
          description: Total request processing and generation latency in milliseconds
          example: 185
        latency:
          type: number
          format: float
          description: Latency in milliseconds or floating point seconds
          example: 185.2
        responseLatency:
          type: number
          description: Response latency representation
          example: 185.2
        responseLatencyMs:
          type: integer
          description: Response latency in integer milliseconds
          example: 185
        executionTimeMs:
          type: integer
          description: Search and generation execution time in milliseconds
          example: 185

    SearchRequest:
      type: object
      required:
        - terms
      properties:
        terms:
          type: string
          minLength: 1
          maxLength: 500
          description: Search terms and keywords entered by user
          example: "ФГОС эпидемиология зачетные единицы ГИА"
        facets:
          $ref: '#/components/schemas/SearchFacetFilters'
        pagination:
          $ref: '#/components/schemas/PaginationRequest'
        sortBy:
          type: string
          enum: [RELEVANCE, DATE_DESC, DATE_ASC, TITLE_ASC]
          default: RELEVANCE

    SearchFacetFilters:
      type: object
      properties:
        documentTypes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentTypeEnum'
        specialtyCodes:
          type: array
          items:
            $ref: '#/components/schemas/SpecialtyCodeEnum'
          example: ["31.08.36"]
        years:
          type: array
          items:
            type: integer
          example: [2024, 2025, 2026]
        status:
          type: string
          enum: [ACTIVE, ARCHIVED, DRAFT, SUPERSEDED]
          default: ACTIVE

    DocumentTypeEnum:
      type: string
      enum:
        - REGULATIONS
        - RULES
        - ORDERS
        - INSTRUCTIONS
        - COMMISSION_PROTOCOLS
        - SYLLABUS_RPD
        - GIA_PROGRAMS
      description: Normalized categorization of institute normative and curricular documents
      example: REGULATIONS

    SpecialtyCodeEnum:
      type: string
      enum:
        - "31.08.36"
        - "31.08.35"
        - "31.08.19"
      description: Medical residency specialty codes supported in CRIE knowledge base
      example: "31.08.36"

    PaginationRequest:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          example: 20

    PaginationMeta:
      type: object
      required:
        - currentPage
        - pageSize
        - totalPages
        - totalRecords
      properties:
        currentPage:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 3
        totalRecords:
          type: integer
          example: 45

    HighlightSnippet:
      type: object
      required:
        - field
        - snippet
      properties:
        field:
          type: string
          example: "content"
        snippet:
          type: string
          example: "Объем программы ординатуры составляет <mark>120 зачетных единиц</mark> независимо от формы обучения..."

    SearchResultItem:
      type: object
      required:
        - documentId
        - title
        - documentType
        - score
        - highlights
      properties:
        documentId:
          type: string
          example: "DOC-2026-FGOS-310836"
        title:
          type: string
          description: Human-readable official title of the document
          example: "ФГОС ВО 31.08.36 Эпидемиология (уровень подготовки кадров высшей квалификации)"
        annotationSnippet:
          type: string
          description: Concise human-readable annotation snippet highlighting key relevance
          example: "Объем программы ординатуры составляет 120 з.е. независимо от применяемых образовательных технологий."
        documentType:
          $ref: '#/components/schemas/DocumentTypeEnum'
        specialtyCode:
          $ref: '#/components/schemas/SpecialtyCodeEnum'
        effectiveDate:
          type: string
          format: date
          example: "2024-09-01"
        summary:
          type: string
          example: "Федеральный государственный образовательный стандарт ординатуры по специальности Эпидемиология."
        score:
          type: number
          format: float
          example: 0.94
        highlights:
          type: array
          items:
            $ref: '#/components/schemas/HighlightSnippet'
        resourceUri:
          type: string
          example: "/api/documents/DOC-2026-FGOS-310836"
        downloadUrl:
          type: string
          description: Direct file download URL
          example: "/api/normative/document/DOC-2026-FGOS-310836/download"
        downloadDocxUrl:
          type: string
          description: Direct file download URL for DOCX format
          example: "/api/normative/document/DOC-2026-FGOS-310836/download?format=docx"
        downloadPdfUrl:
          type: string
          description: Direct file download URL for PDF format
          example: "/api/normative/document/DOC-2026-FGOS-310836/download?format=pdf"

    SearchFacetCount:
      type: object
      required:
        - value
        - count
      properties:
        value:
          type: string
          example: "REGULATIONS"
        label:
          type: string
          description: Human-readable display label in Russian
          example: "Положения и регламенты"
        count:
          type: integer
          example: 12

    SearchFacetDistribution:
      type: object
      properties:
        documentTypes:
          type: array
          items:
            $ref: '#/components/schemas/SearchFacetCount'
        specialtyCodes:
          type: array
          items:
            $ref: '#/components/schemas/SearchFacetCount'
        years:
          type: array
          items:
            $ref: '#/components/schemas/SearchFacetCount'

    DocumentFacetsResponse:
      type: object
      required:
        - facetDistribution
        - totalDocuments
      properties:
        facetDistribution:
          $ref: '#/components/schemas/SearchFacetDistribution'
        totalDocuments:
          type: integer
          example: 1697
          description: Total number of documents cataloged in normative repository

    SearchResponse:
      type: object
      required:
        - results
        - pagination
        - totalMatches
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        totalMatches:
          type: integer
          example: 45
        facetDistribution:
          $ref: '#/components/schemas/SearchFacetDistribution'
        executionTimeMs:
          type: integer
          example: 38

    DocumentMetadataResponse:
      type: object
      required:
        - documentId
        - title
        - documentType
        - status
        - effectiveDate
        - legalGrounding
      properties:
        documentId:
          type: string
          example: "DOC-2026-FGOS-310836"
        title:
          type: string
          example: "ФГОС ВО 31.08.36 Эпидемиология"
        documentType:
          $ref: '#/components/schemas/DocumentTypeEnum'
        specialtyCode:
          $ref: '#/components/schemas/SpecialtyCodeEnum'
        specialtyName:
          type: string
          example: "Эпидемиология"
        status:
          type: string
          enum: [ACTIVE, ARCHIVED, DRAFT, SUPERSEDED]
          example: ACTIVE
        version:
          type: string
          example: "1.0.0"
        effectiveDate:
          type: string
          format: date
          example: "2024-09-01"
        expirationDate:
          type: string
          format: date
          nullable: true
        approvedBy:
          type: string
          example: "Министерство науки и высшего образования Российской Федерации"
        legalGrounding:
          type: array
          items:
            $ref: '#/components/schemas/LegalReference'
        keywords:
          type: array
          items:
            type: string
          example: ["ординатура", "эпидемиология", "ГИА", "компетенции"]
        sections:
          type: array
          items:
            type: object
            required:
              - sectionId
              - title
            properties:
              sectionId:
                type: string
                example: "sec-iv-4.3"
              title:
                type: string
                example: "Раздел IV. Требования к структуре программы ординатуры"
              clauseNumber:
                type: string
                example: "4.3.2"
        downloadUrl:
          type: string
          nullable: true
          example: "/api/normative/document/DOC-2026-FGOS-310836/download"
        downloadDocxUrl:
          type: string
          nullable: true
          example: "/api/normative/document/DOC-2026-FGOS-310836/download?format=docx"
        downloadPdfUrl:
          type: string
          nullable: true
          example: "/api/normative/document/DOC-2026-FGOS-310836/download?format=pdf"
        createdAt:
          type: string
          format: date-time
          example: "2024-09-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-01-15T10:30:00Z"

    ConsultationRequest:
      type: object
      required:
        - query
      properties:
        sessionId:
          type: string
          format: uuid
          description: Optional persistent session ID for multi-turn dialogue memory
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: User inquiry regarding academic hours, exam admission, commissions, or VAK requirements
          example: "Каковы публикационные требования ВАК для допуска к защите кандидатской диссертации по эпидемиологии?"
        targetAudience:
          type: string
          enum: [FACULTY, STUDENT, POSTGRADUATE, ADMINISTRATION]
          default: FACULTY
        contextFilters:
          $ref: '#/components/schemas/NormativeFilter'

    NormativeFilter:
      type: object
      properties:
        specialtyCode:
          $ref: '#/components/schemas/SpecialtyCodeEnum'
        documentTypes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentTypeEnum'

    ConsultationResponse:
      type: object
      required:
        - answer
        - legalGrounding
        - timestamp
      properties:
        answer:
          type: string
          description: Comprehensive legally grounded response
        legalGrounding:
          type: array
          description: Citations to specific normative acts, FGOS VO standards, SanPiN, or local institute regulations
          items:
            $ref: '#/components/schemas/LegalReference'
        suggestedActions:
          type: array
          items:
            type: string
          description: Recommended next steps, e.g. order draft generation
        timestamp:
          type: string
          format: date-time

    LegalReference:
      type: object
      required:
        - documentName
        - articleOrClause
      properties:
        documentId:
          type: string
        documentName:
          type: string
          example: "ФГОС ВО 31.08.36 Эпидемиология"
        articleOrClause:
          type: string
          example: "Раздел IV, п. 4.3.2"
        excerpt:
          type: string
          example: "Объем программы ординатуры составляет 120 зачетных единиц..."
        downloadUrl:
          type: string
          example: "/api/normative/document/DOC-2026-FGOS-310836/download"

    RagConsultantQueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: Inquisitive question regarding institute normative corpus or Rospotrebnadzor standards
          example: "Каков порядок формирования экзаменационных комиссий и кворум УМС?"
        specialtyCode:
          $ref: '#/components/schemas/SpecialtyCodeEnum'
        maxSources:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          example: 5
        contextCategory:
          type: string
          description: Category context filter (ordinatura, aspirantura, commissions, schedule, workload)
          example: "commissions"

    RagSourceDocument:
      type: object
      required:
        - documentId
        - title
        - downloadUrl
      properties:
        documentId:
          type: string
          description: Canonical document identifier
          example: "DOC-2026-REG-UMS-01"
        title:
          type: string
          description: Human-readable official title of normative act
          example: "Положение об учебно-методическом совете (УМС)"
        articleOrClause:
          type: string
          description: Specific clause, section, or article number
          example: "Раздел II, п. 3.1"
        snippet:
          type: string
          description: Verbatim text passage excerpt proving grounding
          example: "Кворум заседания УМС считается достигнутым при присутствии не менее 2/3 членов комиссии..."
        downloadUrl:
          type: string
          description: Direct download URL without raw filesystem paths
          example: "/api/normative/document/DOC-2026-REG-UMS-01/download"
        downloadDocxUrl:
          type: string
          description: Direct DOCX download URL
          example: "/api/normative/document/DOC-2026-REG-UMS-01/download?format=docx"
        downloadPdfUrl:
          type: string
          description: Direct PDF download URL
          example: "/api/normative/document/DOC-2026-REG-UMS-01/download?format=pdf"

    RagConsultantQueryResponse:
      type: object
      required:
        - markdownAnswer
        - sources
        - latencyMs
      properties:
        markdownAnswer:
          type: string
          description: Concise, structured markdown-formatted response without conversational filler
          example: "### Порядок формирования комиссий и кворум\n- **Кворум УМС**: Заседание правомочно при участии не менее 2/3 списочного состава (Горелов/Романова).\n- **Решения**: Принимаются простым большинством голосов.\n- **Комиссии**: Состав ГЭК утверждается приказом директора не позднее 1 ноября."
        answerMarkdown:
          type: string
          description: Markdown-formatted answer alias for client compatibility
        conciseAnswer:
          type: string
          description: Single-sentence executive takeaway
          example: "Кворум УМС составляет не менее 2/3 членов, председатели ГЭК утверждаются до 1 ноября."
        sources:
          type: array
          description: Grounding normative documents with human-readable titles, snippets, and direct download links
          items:
            $ref: '#/components/schemas/RagSourceDocument'
        latencyMs:
          type: integer
          description: Search retrieval and answer synthesis latency in milliseconds
          example: 142

    OrderType:
      type: string
      enum:
        - ADMISSION_TO_GIA
        - ENROLLMENT
        - SCHOLARSHIP_APPOINTMENT
      example: ADMISSION_TO_GIA

    SpecialtyInfo:
      type: object
      required:
        - code
        - name
      properties:
        code:
          $ref: '#/components/schemas/SpecialtyCodeEnum'
        name:
          type: string
          example: "Эпидемиология"

    StudentReference:
      type: object
      required:
        - studentId
        - fullName
        - specialty
      properties:
        studentId:
          type: string
          example: "STU-2026-0891"
        fullName:
          type: string
          example: "Иванов Алексей Петрович"
        specialty:
          $ref: '#/components/schemas/SpecialtyInfo'
        academicGroup:
          type: string
          example: "ОРД-ЭПИ-2026-1"
        studyYear:
          type: integer
          minimum: 1
          maximum: 6
          example: 2

    CommissionMember:
      type: object
      required:
        - role
        - fullName
        - academicDegree
        - position
      properties:
        role:
          type: string
          enum: [CHAIRMAN, MEMBER, SECRETARY]
          example: CHAIRMAN
        fullName:
          type: string
          example: "Смирнов Виктор Дмитриевич"
        academicDegree:
          type: string
          example: "д-р мед. наук, профессор"
        position:
          type: string
          example: "Заведующий кафедрой эпидемиологии"

    RospotrebnadzorRequisites:
      type: object
      required:
        - organizationName
        - supervisoryAuthority
        - okpo
        - inn
        - city
      properties:
        organizationName:
          type: string
          default: "ФБУН ЦНИИ Эпидемиологии Роспотребнадзора"
          example: "ФБУН ЦНИИ Эпидемиологии Роспотребнадзора"
        supervisoryAuthority:
          type: string
          default: "Федеральная служба по надзору в сфере защиты прав потребителей и благополучия человека"
        okpo:
          type: string
          pattern: '^\\d{8}$'
          example: "01897362"
        inn:
          type: string
          pattern: '^\\d{10}$'
          example: "7720015689"
        city:
          type: string
          default: "Москва"
          example: "Москва"

    GostFormattingParameters:
      type: object
      required:
        - standard
        - fontFamily
        - fontSizePt
        - margins
      properties:
        standard:
          type: string
          enum: ["GOST_R_7_0_97_2016"]
          default: "GOST_R_7_0_97_2016"
        fontFamily:
          type: string
          enum: ["Times New Roman"]
          default: "Times New Roman"
        fontSizePt:
          type: integer
          enum: [14]
          default: 14
        lineSpacing:
          type: number
          default: 1.5
        margins:
          type: object
          required:
            - leftMm
            - rightMm
            - topMm
            - bottomMm
          properties:
            leftMm:
              type: integer
              enum: [30]
              default: 30
            rightMm:
              type: integer
              enum: [15]
              default: 15
            topMm:
              type: integer
              enum: [20]
              default: 20
            bottomMm:
              type: integer
              enum: [20]
              default: 20

    OrderGenerationRequest:
      type: object
      required:
        - orderType
        - registrationDate
        - students
        - commissionMembers
        - gostFormatting
        - requisites
      properties:
        orderType:
          $ref: '#/components/schemas/OrderType'
        orderNumber:
          type: string
          description: Optional pre-assigned order number. If omitted, generated automatically.
          example: "2026-ОД/145"
        registrationDate:
          type: string
          format: date
          example: "2026-11-10"
        headerTitle:
          type: string
          description: Order heading title
          example: "О допуске ординаторов 2 года обучения к государственной итоговой аттестации"
        preambleText:
          type: string
          description: Justification preamble clause
          example: "В соответствии с Федеральным законом «Об образовании в РФ», ФГОС ВО и положением о проведении ГИА..."
        students:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StudentReference'
        commissionMembers:
          type: array
          minItems: 3
          items:
            $ref: '#/components/schemas/CommissionMember'
        gostFormatting:
          $ref: '#/components/schemas/GostFormattingParameters'
        requisites:
          $ref: '#/components/schemas/RospotrebnadzorRequisites'
        signerName:
          type: string
          default: "Директор института"
          example: "Акимкин В.Г."
        signerTitle:
          type: string
          default: "Директор ФБУН ЦНИИ Эпидемиологии Роспотребнадзора, академик РАН"

    OrderGenerationResponse:
      type: object
      required:
        - orderId
        - orderNumber
        - generatedAt
        - downloadUrl
        - documentStatus
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
          example: "2026-ОД/145"
        documentStatus:
          type: string
          enum: [DRAFT, READY, FAILED]
          example: READY
        generatedAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
          example: "/api/orders/download/78b54a0d-bfd7-43d3-b7e9-04162f32b912.docx"
        pageCount:
          type: integer
          example: 3
        complianceSummary:
          type: object
          properties:
            standard:
              type: string
              example: "ГОСТ Р 7.0.97-2016"
            fontVerified:
              type: boolean
              example: true
            marginsVerified:
              type: boolean
              example: true

    FieldDiagnosticError:
      type: object
      required:
        - field
        - message
        - code
      properties:
        field:
          type: string
          description: JSON pointer or dot-path of invalid field
          example: "gostFormatting.margins.leftMm"
        message:
          type: string
          description: Human-readable diagnostic description of validation failure
          example: "Left margin must equal 30 mm per GOST R 7.0.97-2016"
        code:
          type: string
          description: Programmatic error code
          example: "INVALID_GOST_MARGIN"
        rejectedValue:
          description: The invalid value submitted by client

    ValidationErrorResponse:
      type: object
      required:
        - error
        - message
        - errors
      properties:
        error:
          type: string
          example: "Unprocessable Entity"
        message:
          type: string
          example: "Validation failed for search query parameters"
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldDiagnosticError'

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "INTERNAL_GENERATION_ERROR"
        message:
          type: string
          example: "An unexpected error occurred during document assembly"
        details:
          type: string
